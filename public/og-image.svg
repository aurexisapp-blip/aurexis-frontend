      <stop offset="0%" stop-color="#07090f"/>
      <stop offset="100%" stop-color="#0d1220"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00b450"/>
      <stop offset="100%" stop-color="#00d462"/>
