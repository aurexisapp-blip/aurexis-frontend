    <meta http-equiv="X-Content-Type-Options" content="nosniff" />

         <meta> (Chrome/Firefox/Safari all warn "may only be set via an HTTP
         header") -- it was a no-op here. Already correctly enforced via the
         real HTTP header in vercel.json ("X-Frame-Options": "DENY"), so
         nothing is lost by dropping the dead, warning-triggering copy. -->
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />
