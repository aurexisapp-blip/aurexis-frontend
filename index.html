<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale/user-scalable=no: without this, a touch that leaks
         through from a native overlay (e.g. Apple's own SKStoreReviewController
         star-rating card) into the underlying WKWebView can register as a
         pinch/zoom gesture and leave the whole app zoomed in with no way to
         reset it from inside the page. Standard for an app-shell SPA. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Security headers via meta tags -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <!-- X-Frame-Options removed: browsers ignore it entirely when set via
         <meta> (Chrome/Firefox/Safari all warn "may only be set via an HTTP
         header") -- it was a no-op here. Already correctly enforced via the
         real HTTP header in vercel.json ("X-Frame-Options": "DENY"), so
         nothing is lost by dropping the dead, warning-triggering copy. -->
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Aurexis – AI Trading Tool</title>
    <link rel="canonical" href="https://useaurexis.com/" />
    <meta name="description" content="Aurexis (useaurexis.com): AI stock signals for paper trading. No deposits, no broker connection." />
    <meta name="keywords" content="stock signals, AI trading, stock picks, algorithmic trading, trade alerts" />
    <meta name="author" content="Aurexis" />
    <!-- Open Graph -->
    <meta property="og:title" content="Aurexis – AI Trading Tool" />
    <meta property="og:description" content="Aurexis (useaurexis.com): AI stock signals for paper trading. No deposits, no broker connection." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://useaurexis.com" />
    <meta property="og:image" content="https://useaurexis.com/og-image.svg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Aurexis" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@aurexisapp" />
    <meta name="twitter:title" content="Aurexis – AI Trading Tool" />
    <meta name="twitter:description" content="Aurexis (useaurexis.com): AI stock signals for paper trading. No deposits, no broker connection." />
    <meta name="twitter:image" content="https://useaurexis.com/og-image.svg" />
    <!-- #seo-static (plain-HTML facts for crawlers that don't run JS) is
         injected into #root at build time by vite.config.js and hidden here
         the moment JavaScript runs, so visitors never see it. -->
    <style>.js #seo-static{display:none}</style>
    <script>document.documentElement.classList.add("js")</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
